<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Palak ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
background:linear-gradient(135deg,#ff6b81,#ff9aa2,#ffd1dc);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}
.container{
text-align:center;
background:white;
padding:30px;
border-radius:20px;
max-width:800px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}
h1{
color:#ff2d55;
font-size:45px;
margin-bottom:15px;
}
p{
font-size:20px;
color:#555;
margin-bottom:20px;
}
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:20px 0;
}
.gallery img{
width:100%;
height:170px;
object-fit:cover;
border-radius:15px;
}
button{
padding:15px 30px;
border:none;
border-radius:30px;
background:#ff2d55;
color:white;
font-size:18px;
cursor:pointer;
}
#msg{
display:none;
margin-top:20px;
font-size:24px;
color:#ff2d55;
font-weight:bold;
}
.heart{
position:fixed;
top:-20px;
font-size:24px;
animation:fall linear infinite;
}
@keyframes fall{
to{
transform:translateY(110vh);
}
}
</style>
</head>
<body>

<div class="container">

<h1>I Love You Palak ❤️</h1>

<p>Every moment with you is special. ❤️</p>

<div class="gallery">
<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
<img src="6.jpg">
</div>

<button onclick="love()">Click Here ❤️</button>

<div id="msg">
Forever & Always ❤️<br>
Love You So Much, Palak ❤️<br><br>
— Yuvraj
</div>

</div>

<script>
function love(){
document.getElementById("msg").style.display="block";
}
for(let i=0;i<60;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(h);
}
</script>

</body>
</html>
