<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Palak ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 1. Opening Screen */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff758c;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            z-index: 999;
            transition: opacity 1s ease, visibility 1s;
            text-align: center;
            padding: 20px;
        }

        /* 2. Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            margin-top: 10px;
        }

        /* Envelope Text Section */
        .envelope-title {
            color: #ff416c;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Circular Photos */
        .photos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .photos img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff758c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Letter Box with Typing Effect */
        .letter-box {
            background: #fff0f3;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 220px;
            border: 1px dashed #ff758c;
            word-wrap: break-word;
        }

        /* Glowing Button */
        .glow-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
            transition: all 0.3s ease;
            width: 100%;
        }

        .glow-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.9);
        }

        /* Final Success Message */
        #final-message {
            display: none;
            font-size: 1.2rem;
            color: #d63384;
            font-weight: bold;
            margin-top: 15px;
            animation: fadeIn 1s ease-in;
        }

        /* Floating Hearts Background Animation */
        .heart {
            position: fixed;
            color: #ff4b2b;
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            bottom: -30px;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. Opening Screen -->
    <div id="welcome-screen">
        For Someone Very Special ❤️
    </div>

    <!-- 2. Main Apology Card -->
    <div class="card">
        <h2 class="envelope-title">Dear Palak ❤️</h2>

        <!-- Circular Photos -->
        <div class="photos">
            <img src="yuvraj.jpg" alt="Yuvraj" onerror="this.src='https://ui-avatars.com/api/?name=Yuvraj&background=ff758c&color=fff'">
            <img src="palak.jpg" alt="Palak" onerror="this.src='https://ui-avatars.com/api/?name=Palak&background=ff416c&color=fff'">
        </div>

        <!-- Typing Letter Box -->
        <div class="letter-box">
            <p id="typed-text"></p>
        </div>

        <!-- Button & Final Message -->
        <button id="chance-btn" class="glow-btn" onclick="acceptApology()">Please Give Me One Chance ❤️</button>
        <div id="final-message">I Promise I'll Never Stop Trying ❤️</div>
    </div>

    <script>
        // Automatic Opening Screen Hide (After 3 Seconds)
        setTimeout(() => {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.visibility = 'hidden';
                startTyping();
            }, 1000);
        }, 3000);

        // Typing Effect Letter Text
        const textToType = `Dear Palak,\n\nI'm truly sorry.\n\nMujhse galti hui aur us baat ka mujhe dil se afsos hai.\nMain excuses nahi dena chahta.\nBas itna kehna chahta hoon ki tum meri life ka sabse important hissa ho.\n\nPlease ek last chance de do.\nMain apne actions se prove karunga ki main better insaan ban sakta hoon.\n\nI Miss You.\n\nForever Yours,\nYuvraj ❤️`;

        let index = 0;
        function startTyping() {
            if (index < textToType.length) {
                let char = textToType.charAt(index);
                document.getElementById("typed-text").innerHTML += (char === '\n') ? '<br>' : char;
                index++;
                setTimeout(startTyping, 35);
            }
        }

        // Action when Button Clicked
        function acceptApology() {
            document.getElementById("chance-btn").style.display = "none";
            document.getElementById("final-message").style.display = "block";

            // Burst of hearts
            for(let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 50);
            }
        }

        // Floating Hearts Logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }

        // Continuous light background hearts
        setInterval(createHeart, 600);
    </script>
</body>
</html>
