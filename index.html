<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Malkin Ji ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#ff758c,#ff7eb3);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

overflow:hidden;

}

.container{

width:90%;

max-width:380px;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}

h1{

color:#ff2d55;

margin-bottom:15px;

}

img{

width:100%;

height:300px;

object-fit:cover;

border-radius:20px;

}

p{

margin:18px 0;

font-size:17px;

color:#555;

line-height:1.6;

}

button{

background:#ff2d55;

color:white;

padding:15px 30px;

border:none;

border-radius:35px;

font-size:18px;

cursor:pointer;

}

#love{

display:none;

margin-top:20px;

font-size:24px;

color:#ff2d55;

font-weight:bold;

}

</style>
</head>

<body>

<div class="container">

<h1>❤️ I Love You Palak ❤️</h1>

<img id="photo" src="palak1.jpg">

<p>

Every smile of yours makes my day beautiful.

Thank you for being part of my life.

Forever Yours ❤️

<br><br>

<b>Yuvraj</b>

</p>

<button onclick="showLove()">

Touch My Heart ❤️

</button>

<div id="love">
  <div id="love" style="display:none;margin-top:20px;">
<h2>❤️ I Love You Forever Palak ❤️</h2>
<p>You are my everything. 🥰</p>
  </div>

I Love You Forever ❤️

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const photos=[
"palak1.jpg",
"palak2.jpg",
"palak3.jpg",
"palak4.jpg",
"palak5.jpg",
"palak6.jpg"
];

let index=0;

setInterval(function(){

index++;

if(index>=photos.length){

index=0;

}

document.getElementById("photo").src=photos[index];

},2500);

function showLove(){

document.getElementById("love").style.display="block";

confetti({

particleCount:180,

spread:120,

origin:{y:0.6}

});

}

setInterval(function(){

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.style.position="fixed";

heart.style.left=Math.random()*100+"vw";

heart.style.bottom="-20px";

heart.style.fontSize="25px";

heart.style.animation="fly 6s linear";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},400);

</script>

<style>

@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

</style>
<!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()"
style="position:fixed;top:15px;right:15px;
padding:10px 15px;border:none;
border-radius:25px;background:#ff2d55;
color:white;cursor:pointer;z-index:999;">
🎵 Music
</button>

<style>
#photo{
transition:0.8s;
box-shadow:0 10px 25px rgba(255,45,85,.35);
}

.container{
animation:fadeIn 1.2s;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.9);
}
to{
opacity:1;
transform:scale(1);
}
}

button:hover{
transform:scale(1.05);
transition:.3s;
}
</style>

<script>
let music=document.getElementById("bgMusic");

function toggleMusic(){
if(music.paused){
music.play();
document.getElementById("musicBtn").innerHTML="🔊 Playing";
}else{
music.pause();
document.getElementById("musicBtn").innerHTML="🎵 Music";
}
}

// Double tap anywhere for heart explosion
document.body.addEventListener("dblclick",function(){

confetti({
particleCount:250,
spread:140,
origin:{y:.5}
});

});
</script>
</body>
</html>
