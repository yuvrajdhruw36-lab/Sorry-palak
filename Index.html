<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Palak ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffd1dc);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
text-align:center;
color:white;
}

h1{
font-size:45px;
animation:fade 2s ease;
}

p{
font-size:20px;
margin-top:15px;
animation:fade 3s ease;
}

button{
margin-top:35px;
padding:15px 35px;
border:none;
border-radius:40px;
background:white;
color:#ff2d55;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.4s;
}

button:hover{
transform:scale(1.08);
}

#letter{
display:none;
background:white;
color:#444;
padding:25px;
border-radius:20px;
max-width:700px;
margin:25px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
animation:fade 1s ease;
}

img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:5px solid #ff2d55;
margin:10px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
color:white;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container">

<h1>Dear Palak ❤️</h1>

<p>Every heartbeat reminds me of you...</p>

<button onclick="openLetter()">
Open My Heart 💌
</button>

<div id="letter">

<img src="yuvraj.jpg">

<img src="palak.jpg">

<h2>I'm Truly Sorry ❤️</h2>

<p id="typing"></p>

</div>

</div>

<script>

const text=`Dear Palak,

I'm truly sorry.

Mujhse galti hui aur us baat ka mujhe dil se afsos hai.

Main excuses nahi dena chahta.

Bas itna kehna chahta hoon ki tum meri life ka sabse important hissa ho.

Please ek last chance de do.

Forever Yours,
Yuvraj ❤️`;

let i=0;

function openLetter(){

document.getElementById("letter").style.display="block";

type();

}

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,40);

}

}

for(let x=0;x<60;x++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
